<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>زول</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: Vazirmatn, Tahoma, sans-serif; background: #0f1117; color: #e6e6e6; }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 3rem; margin: 0 0 .5rem; }
    .status { display: inline-block; margin-top: 1rem; padding: .4rem 1rem; border-radius: 999px; }
    .up { background: #12391f; color: #7ee2a0; }
    .down { background: #3b1717; color: #f19a9a; }
    small { color: #888; }
  </style>
</head>
<body>
  <main>
    <h1>زول</h1>
    <p>دستیار شخصی — نسخهٔ {{ version }}</p>
    {% if engine.reachable %}
      <span class="status up">موتور روشن است</span>
    {% else %}
      <span class="status down">موتور در دسترس نیست{% if engine.detail %} ({{ engine.detail }}){% endif %}</span>
    {% endif %}
    <p><small>پنل مدیریت: /admin/</small></p>
  </main>
</body>
</html>
