# اجرای لوکال: docker compose up --build
# دقیقاً مثل همروش: یک کانتینر با nginx (:8000) + جنگو + موتور.
#   UI ایجنت:   http://localhost:8000/?token=<OPENMUSE_SERVER_TOKEN>
#   صفحهٔ زول:  http://localhost:8000/zoul/
#   ادمین:      http://localhost:8000/admin/
services:
  zoul:
    build: .
    container_name: zoul
    volumes:
      - .:/code
      - zoul_data:/data
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=True
      - RUN_ENGINE=1
    restart: always

volumes:
  zoul_data:
