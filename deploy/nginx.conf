# ======================================================================
#  دروازهٔ زول: nginx روی پورت 8000 (تنها پورتی که همروش بیرون می‌دهد)
# ----------------------------------------------------------------------
#  /admin/ ، /static/ ، /health/ ، /engine/ ، /zoul/  ← جنگو (127.0.0.1:8001)
#  بقیه (/ ، /api/ ، /ws ، /assets/ ، ...)           ← OpenMuse (127.0.0.1:8787)
#
#  چرا nginx و نه پراکسی داخل جنگو: UI موتور آدرس‌هایش را از ریشهٔ دامنه
#  می‌خواند و چت روی WebSocket (/ws) است؛ gunicorn/WSGI نمی‌تواند WebSocket
#  را پراکسی کند. مستند: docs/features/gateway.md
# ======================================================================
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # ⚠️ عمداً $uri و نه $request: توکن UI در query string (?token=...) می‌آید
    # و نباید در لاگ همروش ثبت شود.
    log_format zoul '$time_local $status $request_method $uri $body_bytes_sent ${request_time}s';
    access_log /dev/stdout zoul;

    # عکس‌های گوشی تا ۲۵ مگابایت (server.max_upload_mb موتور) + حاشیه.
    client_max_body_size 30m;

    # همروش جلوتر TLS را باز می‌کند و پروتکل اصلی را در این هدر می‌فرستد.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream django { server 127.0.0.1:8001; }
    upstream engine { server 127.0.0.1:8787; }

    server {
        listen 8000 default_server;

        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_http_version 1.1;

        # ---------- جنگو ----------
        location ~ ^/(admin|static|engine|zoul)(/|$) {
            proxy_set_header Host $host;
            proxy_pass http://django;
        }

        # بررسی سلامت همروش با IP داخلی پاد می‌آید، نه دامنه؛ جنگو با
        # DEBUG=False چنین Hostی را رد می‌کند (DisallowedHost ← 400). اینجا
        # Host ثابت localhost می‌شود تا probe همیشه به خود اپ برسد.
        location = /health/ {
            proxy_set_header Host localhost;
            proxy_pass http://django;
        }

        # ---------- موتور OpenMuse (UI، API، WebSocket) ----------
        location / {
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # پاسخ‌ها و رویدادها را همان لحظه بفرست، بافر نکن.
            proxy_buffering off;
            # کار ایجنت و WebSocket می‌تواند طولانی باشد.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://engine;
        }
    }
}
